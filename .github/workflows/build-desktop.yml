name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release artifacts to GitHub Releases'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            build_args: --win nsis portable
            artifact_pattern: release/*.exe
          - os: macos-latest
            platform: macOS
            build_args: --mac dmg zip
            artifact_pattern: |
              release/*.dmg
              release/*.zip
          - os: ubuntu-latest
            platform: Linux
            build_args: --linux AppImage deb
            artifact_pattern: |
              release/*.AppImage
              release/*.deb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          node -e "try { require('fs').unlinkSync('package-lock.json'); } catch {}"
          npm install

      - name: Build web assets and desktop bundles
        run: npm run desktop:build

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2 || sudo apt-get install -y libarchive-tools libfuse2t64 || true

      - name: Package with Electron Builder
        run: npx electron-builder ${{ matrix.build_args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radiarr-${{ matrix.platform }}-builds
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: warn

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v0.8.0' }}
          files: ${{ matrix.artifact_pattern }}
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
