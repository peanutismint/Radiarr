name: Build & Release Desktop App

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish release artifacts to GitHub Releases'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Publishing a release from a new tag fires both the tag push and the release
# event. Sharing one group per tag means the second run cancels the first, so
# the (expensive) Windows and macOS builds only run once per version.
concurrency:
  group: desktop-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            build_args: --win nsis portable
            artifact_pattern: release/*.exe
          - os: macos-latest
            platform: macOS
            build_args: --mac dmg --x64 --arm64
            artifact_pattern: release/*.dmg
          - os: ubuntu-latest
            platform: Linux
            build_args: --linux AppImage
            artifact_pattern: release/*.AppImage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          node -e "try { require('fs').unlinkSync('package-lock.json'); } catch {}"
          npm install

      - name: Build web assets and desktop bundles
        run: npm run desktop:build

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2 || sudo apt-get install -y libarchive-tools libfuse2t64 || true

      # macOS: if the Apple Developer secrets are set, the app is signed with the
      # Developer ID certificate and notarized by Apple, so it opens with no warning.
      # Without them it gets a free "ad-hoc" signature, which macOS treats as an
      # unidentified developer (Open Anyway) rather than reporting the app as damaged.
      - name: Package with Electron Builder (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "Signing with Developer ID and notarizing with Apple"
            npx electron-builder ${{ matrix.build_args }} --publish never -c.mac.notarize=true
          else
            echo "Apple Developer secrets not set: using an ad-hoc signature"
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder ${{ matrix.build_args }} --publish never -c.mac.identity=-
          fi

      - name: Package with Electron Builder
        if: runner.os != 'macOS'
        run: npx electron-builder ${{ matrix.build_args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: radiarr-${{ matrix.platform }}-builds
          path: ${{ matrix.artifact_pattern }}
          if-no-files-found: warn
          # The release keeps the real copies, so these only need to last a few days.
          retention-days: 3

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || 'v0.8.0' }}
          files: ${{ matrix.artifact_pattern }}
          fail_on_unmatched_files: false
          # Notes are written when a release is published on GitHub; adding them
          # here too made every platform build append another copy.
          generate_release_notes: ${{ github.event_name != 'release' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
